created_at: '2026-10-06T18:06:00-05:00'
data:
  dataset_path: datasets/ROV-MARINARIUM-DATASET-PAPER-MANUAL-COMMANDS-5s/PAPER-MANUAL-COMMANDS-5s_clean.pkl
  train_key: train_trajectories
  test_key: test_trajectories
  window_points: 10
  window_stride: 6
  substeps: 1
  control_scaling: rms
experiment:
  root: experiments/rov_se3/real_marinarium_05-10-2026/runs
  name_suffix: PH-NODE-ORIG_REAL-MARINARIUM
  notes:
  - BlueROV2 real data (KTH Marinarium, manual recording, paper chronological 80/20 split), 8 raw PX4 commands as input, 5
    s training pieces cut into 10-point windows (0.18 s, stride 6), 5000 steps, final model, float64; no priors, no pretraining.
    Protocol of the pendulum / quadrotor campaigns; M1_form spd (added mass) and V_rotation (buoyancy above the CG) are model
    forms only.
  - 'PH-NODE with the ORIGINAL real-flight training recipe (LieGroupHamDL train_quadrotor_SE3_PX4.py): num_points 10 (9 RK4
    steps per sequence), every 6th window, full batch, Adam 1e-3 constant, no gradient clipping, float64, L1 0.02 on G, D_v,
    D_omega; 5000 steps as the paper text (code default 2500). RK4 kept (the original used Dopri5).'
  - Previous PH-NODE (05-10, 100-step windows, lr 3e-3 cosine, batch 16) produced NaN gradients from step 5.
model:
  control_dim: 8
  M1_form: spd
  V_rotation: true
  family: nn
  feature_count: 64
  initial_D: 1.0
  initial_M_inverse: 1.0
  initial_control_gp_mean_scale: 0.0
  initial_diffusion: 0.1
  initial_log_std: -5.0
  initial_observation_sigma: 0.1
  initial_randomness: 1.0
  integrator: rk4
  matern_length_scale: 1.0
  matern_smoothness: 2.5
  nn_hidden: 20
  nn_layers: 2
  wind: false
optimizer:
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-08
  final_learning_fraction: 1.0
  gradient_clip_norm: 1000000.0
  learning_rate: 0.001
  level_learning_rate: 0.25
runtime:
  enable_x64: true
  gpu: 1
schema: ph_node/rov/v1
training:
  batch_size: 4674
  checkpoint_every: 1000
  eval_every: 500
  eval_windows: null
  kl_anneal_steps: 1000
  kl_beta_max: 1.0
  loss: rollout
  seed: 0
  total_steps: 5000
  l1_coefficient: 0.02
