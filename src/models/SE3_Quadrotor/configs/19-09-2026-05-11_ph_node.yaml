  title: PH-NN RK4 JAX model report
  trajectory_count: 10
  random_seed: 42
  dpi: 150
  experiment_dirs: null
  posterior_samples: 0
  evaluation_dataset: datasets/QUADROTOR-DATASET-IDSIA/IDSIA_CF21BL_10s_h0p01_clean.pkl
