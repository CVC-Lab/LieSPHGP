  name: prodigy-levels-per-subnetwork
  learning_rate: 0.001
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-08
  weight_decay: 0.0
  gradient_clip_norm: 10.0
  level_learning_rate: 1.0
gp:
  enabled: true
  kernel: matern
  matern_smoothness: 2.5
  model_backend: utils-gp-model
  matern_length_scale: 1.0
  period: 6.283185307179586
  periodic_length_scale: 0.5
  periodic_harmonics: 5
  periodic_dimension: 0
  mass_1_feature_count: 220
  mass_2_feature_budget: 220
  dissipation_v_feature_count: 225
  dissipation_w_feature_count: 220
  potential_position_feature_count: 20
