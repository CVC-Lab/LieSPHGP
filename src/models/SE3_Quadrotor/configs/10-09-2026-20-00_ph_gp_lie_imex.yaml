model:
  name: ph_gp_lie_imex
  family: gp
  solver: lie-imex
  hidden_dim: null
  activation: null
  initialization_gain: null
  dissipation_enabled: true
  mass_epsilon: 0.01
  mass_factor_epsilon: null
  optional_subnetwork: null
data:
  dataset_path: tmp/data/AGGR_CF2P_randstart_setpoint0p25s_persistentEXC_PYB1000Hz_contact-free_nonlinear-damping-c0p5_162flights_1sec_h0p01_clean.pkl
  window_points: 11
  window_stride: 10
  time_varying_controls: true
  max_train_windows: null
  max_test_windows: null
  observation_noise_override: 0.01
training:
  seed: 0
  total_steps: 20000
  batch_size: 256
  eval_every: 500
  checkpoint_every: 1000
  loss: se3-nll
  loss_scale: 1.0
  mass_pretrain_steps: 0
