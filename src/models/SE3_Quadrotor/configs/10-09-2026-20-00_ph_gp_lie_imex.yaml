  control_position_feature_count: 20
  control_rotation_feature_budget: 11
  initial_log_standard_deviation: -5.0
  inverse_mass_2_initial_value: 1000.0
  dissipation_v_initial_value: 1.0
  dissipation_w_initial_value: 0.001
  kl_beta_max: 1.0
  kl_anneal_steps: 1000
  data_fit: se3-nll
  initial_observation_sigma: 0.1
  fixed_observation_sigma: null
  nll_squared_error_scale: 1.0
  direct_control_map: false
  optional_mean_subnetwork: null
runtime:
  device: gpu
  device_index: 0
  require_gpu: true
  jax_enable_x64: false
  matmul_precision: highest
  enable_compilation_cache: true
  compilation_cache_dir: experiments/quadrotor/.jax_cache
experiment:
  root: experiments/quadrotor/train_runs
  name_suffix: levels-nll-noise0p01-K10-20k-prodigy-1sec-AGGR
  history_file: experiments/quadrotor/experiment_history.txt
  changes:
  - Learned levels (no dataset physics) for M1^-1, M2^-1, Dv, Dw, and g; GP residuals
    on top.
  - Position-only potential V(x); gravity learned inside the GP.
  - SE(3) negative log-likelihood with learned per-block sigma; KL spread over all
    training transitions (beta 1).
  - Windows of 11 points (K=10 transitions, 0.10 s) with stride 10 (no overlap), cut
    from the full flights.
  - 20000 optimizer steps at h=0.01 s; evaluation every 500, checkpoint every 1000.
  - Observation noise 0.01 on the 18 training state channels with rotations re-projected
    onto SO(3); test set clean.
  - Per-subnetwork Prodigy (distance-adaptive, eta=1, d0=1e-3, safeguard warm-up)
    on the 43 level scalars only; Adam 1e-3 for GP weight means, log-stds and likelihood
    sigmas; global-norm gradient clipping at 10.
  - 'Multi-horizon loss (ph_gp_lie_imex_1sec): windows plus a finite-masked, twist-bounded,
    25-step-truncated NLL on 8 full flights; curriculum 0.25 s from step 2000, 0.5
    s from 5000, 1 s from 10000; weight 0.2 with 1000-step ramp; likelihood sigmas
    frozen in the long term.'
  - 1 s open-loop position RMS and relative error on the clean test flights logged
    at every evaluation.
  - 'Training data: aggressive random-start, 0.25 s setpoint, persistent multisine
    excitation dataset (AGGR, clean pickle; noise 0.01 added by the loader). Same
    code and settings as the multi-horizon run.'
report:
  enabled: true
  auto_generate: true
  generator: src.models.SE3_Quadrotor.comparision.generate_report
  exact_pages: 47
  output_name: model_report_47_pages.pdf
  title: PH-GP Lie-IMEX V2 JAX model report
  trajectory_count: 10
  random_seed: 42
  dpi: 150
  experiment_dirs: null
