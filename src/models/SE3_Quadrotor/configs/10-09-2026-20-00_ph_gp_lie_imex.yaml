  mass_pretrain_samples: 4096
  initial_checkpoint: null
  resume_checkpoint: null
  long_horizon_flights: 8
  long_horizon_weight: 0.2
  long_horizon_schedule:
  - - 2000
    - 0.25
  - - 5000
    - 0.5
  - - 10000
    - 1.0
  long_horizon_truncation_steps: 25
  long_horizon_twist_bound: 50.0
  long_horizon_test_seconds: 1.0
