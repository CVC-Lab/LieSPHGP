experiment:
  root: experiments/quadrotor/train_runs
  name_suffix: levels-nll-noise0p1-HARDV3yaw-curriculumS-stage2-K50-3k-scratch-latentx0-structV
  history_file: experiments/quadrotor/experiment_history.txt
  changes:
  - Learned levels (no dataset physics) for M1^-1, M2^-1, Dv, Dw, and g; GP residuals on top.
  - 'Potential V(x) = lambda_V^T x + GP(x): learned linear level (zero init, outside the KL, own Prodigy
    group).'
  - SE(3) negative log-likelihood with learned per-block sigma; KL spread over all training transitions
    (beta 1). Standard single-term window loss (no multi-horizon term).
  - Per-subnetwork Prodigy (eta=0.5, d0=1e-3, safeguard warm-up) on the level scalars only; Adam 1e-3
    for GP weight means, log-stds and likelihood sigmas; global-norm gradient clipping at 10. Fresh optimizer
    state at every curriculum stage (initial_checkpoint, parameters only).
  - 1 s and 3 s open-loop position RMS on the clean test flights logged at every evaluation (test_long1s_*
    / test_long3s_* in training_stats.npz).
  - 'Window-length curriculum B (no stage 1): K=50 for 3000 steps from scratch; K=100 for 5000 steps;
    overlapping windows stride 10; fresh optimizer per stage (initial_checkpoint).'
  - 'Report controller: reference law WITH the learned damping feedforward +Dv v_b, +Dw omega_b (report.controller_use_dissipation=true).'
  - 'Latent initial state per training window (training.latent_initial_state=true): variational q(x0_i)=N(x0_obs+m_i,
    s_i^2) on the 12 SE(3) tangent coordinates, prior N(x0_obs, 0.1^2) (=observation noise), KL in the
    ELBO, Adam 1e-2 on (m_i, log s_i), fresh per stage. Errors-in-variables treatment so the damping/thrust/gravity
    products are not biased by the noisy window starts.'
  - 'Training data: QUADROTOR-DATASET-HARD-V3 = HARD-V2 protocol (gusts off, kick torque recorded) plus
    yaw-rate excitation: new yaw_kick segment (impulsive J_zz*rate torque about body z, rate 3-6 rad/s,
    weight 1.2) and yaw_turn weight 1.0; 50 train / 10 test flights of 10 s at h=0.01 s, absolute observation
    noise 0.1 on the training flights, test split clean.'
  - 'Structured potential (gp.structured_potential=true): V(x) = g z / mu(x) with the learned position-dependent
    inverse mass mu(x) = exp(lambda0 + GP_M1(x)), g = 9.81; the V GP and its linear level are unused;
    gravity-consistency penalty OFF (gp.gravity_penalty_weight=0), level prior OFF.'
  - 'This run: levels-nll-noise0p1-HARDV3yaw-curriculumS-stage2-K50-3k-scratch-latentx0-structV.'
