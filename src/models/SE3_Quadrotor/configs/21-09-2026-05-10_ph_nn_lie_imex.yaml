  changes:
  - PH-NODE (Duong & Atanasov SE(3) Hamiltonian ODE) as published, MLP subnetworks, tanh, initialization gain 0.001, trajectory
    MSE, Adam 5e-4, no gradient clipping, no learned sigma, no latent initial state.
  - 'ONLY change to the published model: the dissipation subnetworks take body velocity and body rate, Dv(v_b) and Dw(omega_b),
    instead of position and rotation, so they can represent the simulator''s speed-dependent damping.'
  - 'DEEP ENSEMBLE (NeurIPS reviewer 6Ap3, W3: justify GP uncertainty against scalable alternatives such as deep ensembles).
    Five seeds of the identical published PH-NN-LieIMEX recipe on HARD sigma=0.25; the ensemble mean and variance are scored
    with exactly the metrics used for the GP posterior (coverage@2sigma, sharpness, NLPD, Spearman rho), so the two uncertainty
    mechanisms are compared on equal terms.'
  - Ensemble member 0 of 5 (training.seed=0).
