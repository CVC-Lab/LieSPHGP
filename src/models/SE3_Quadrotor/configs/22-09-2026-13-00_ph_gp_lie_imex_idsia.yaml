experiment:
  root: experiments/quadrotor/train_runs
  name_suffix: gp-lieimex-ODE-IDSIA-rotor2-ONEINIT-stage1-K50-3k-nopriors-fp32-nopretrain-h0p01
  history_file: experiments/quadrotor/experiment_history.txt
  changes:
  - PH-GP-LieIMEX-ODE on rotor2 with ALL operator initialisations at 1.  Source recipe 19-09-20-24 used control levels at
    ones, inverse_mass_2 = 1.0 and Dv = Dw = 0.1; here every one of those is 1.0 (M2^-1, Dv, Dw and the control levels). control_initial_mean_scale
    stays 0 so G starts exactly at its level with no random component; M2^-1, Dv and Dw cannot be 0 in any case - the config
    validator requires them positive, and M2^-1 = 0 would mean infinite inertia.  Priors off, float32, no mass pre-training,
    window 51, stride 10, 3000 steps, seed 0 - matched to the PH-NN rotor2 runs.
  - integration_substeps = 1 -> integrator step 0.01 s, loss still on the recorded 100 Hz grid.
  - 'Set to 1.0: inverse_mass_2_initial_value, dissipation_v_initial_value, dissipation_w_initial_value, control_level_initial
    (all 24 entries). control_initial_mean_scale = 0.'
  - 'This run: gp-lieimex-ODE-IDSIA-rotor2-ONEINIT-stage1-K50-3k-nopriors-fp32-nopretrain-h0p01.'
