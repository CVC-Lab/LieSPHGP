  changes:
  - Learned levels (no dataset physics) for M1^-1, M2^-1, Dv, Dw, and g; GP residuals on top.
  - 'Potential V(x) = lambda_V^T x + GP(x): learned linear level (zero init, outside the KL, own Prodigy group).'
  - SE(3) negative log-likelihood with learned per-block sigma; KL spread over all training transitions (beta 1).
    Standard single-term window loss (no multi-horizon term).
  - Per-subnetwork Prodigy (eta=0.5, d0=1e-3, safeguard warm-up) on the level scalars only; Adam 1e-3 for GP weight
    means, log-stds and likelihood sigmas; global-norm gradient clipping at 10. Fresh optimizer state at every curriculum
    stage (initial_checkpoint, parameters only).
  - 1 s and 3 s open-loop position RMS on the clean test flights logged at every evaluation (test_long1s_* / test_long3s_*
    in training_stats.npz).
  - 'Soft known-gravity penalty: L_g = w/g^2 * mean_x ||mu(x) grad V(x) - g e3||^2 on 1024 batch states per step
    with the full GP-including mu and V (gp.gravity_penalty_weight=30, gp.known_gravity=9.81); hard level prior
    OFF (gp.gravity_level_prior=false); lambda_V fully learned.'
  - 'Report controller: reference law WITH the learned damping feedforward +Dv v_b, +Dw omega_b (report.controller_use_dissipation=true).'
  - 'Latent initial state per training window (training.latent_initial_state=true): variational q(x0_i)=N(x0_obs+m_i,
    s_i^2) on the 12 SE(3) tangent coordinates, prior N(x0_obs, 0.1^2) (=observation noise), KL in the ELBO, Adam
    1e-2 on (m_i, log s_i), fresh per stage. Errors-in-variables treatment so the damping/thrust/gravity products
    are not biased by the noisy window starts.'
  - 'Training data: QUADROTOR-DATASET-HARD-V3 = HARD-V2 protocol (gusts off, kick torque recorded) plus yaw-rate
    excitation: new yaw_kick segment (impulsive J_zz*rate torque about body z, rate 3-6 rad/s, weight 1.2) and yaw_turn
    weight 1.0; 50 train / 10 test flights of 10 s at h=0.01 s, absolute observation noise 0.1 on the training flights,
    test split clean.'
  - 'Final recipe (0.5 noise): HARD-V3; learned V with gravity-consistency penalty w=30 (structured V off, level
    prior off); MAP latent initial state per window (training.latent_initial_state_sample=false: rollout from x0_obs+m_i,
    no sampling, prior penalty |m_i|^2/(2 sigma^2), floor 0); curriculum K=50 (3k, scratch) -> K=100 (3k) -> K=200
    = 2 s (4k), overlapping windows stride 10, fresh optimizer and latents per stage; Prodigy level rate 0.25.'
  - 'Observation noise NOT assumed known: the four likelihood sigmas start at a neutral 0.3 for every noise level
    and are learned; the latent initial-state prior uses the learned per-block sigma with its log-sigma term (training.latent_initial_state_sigma=learned),
    i.e. the window likelihood''s missing -log p(x0_obs | x0) term. No noise value enters training.'
  - Both physics priors OFF (gravity penalty 0, actuation prior 0).
  - 'HARD-V5 data: HARD-V4 shifted to 1-3 m/s (figure-eight/circle 1-3 m/s radius 1-2 m, hops up to 3.5 m, vertical
    steps 1.5-2.5 m, coasts entered at 2-3 m/s and cut at 1.5-2.5 s, no hover segment, initial speed up to 2 m/s,
    envelope +-3.5 m): mean |v| 1.05 m/s, 46% of samples in 1-3 m/s, 24% below 0.25 m/s.'
  - Observation noise 0.25 (HARD-V5 nonlinear), both physics priors OFF, dissipation inputs unchanged (v_b, omega_b),
    continuity off; Prodigy level rate 0.25 as at 0.5 noise. Auto report on the VARYING 10 s reference flight (figure
    eight + vertical + yaw, never settles).
