  device_index: 0
  require_gpu: true
  jax_enable_x64: false
  matmul_precision: highest
  enable_compilation_cache: true
  compilation_cache_dir: experiments/quadrotor/.jax_cache
experiment:
  root: experiments/quadrotor/train_runs
  name_suffix: gp-lieimex-NANOBENCH-real-stage2-K100-3k-chain-shapedisjoint
  history_file: experiments/quadrotor/experiment_history.txt
  changes:
  - 'REAL-FLIGHT run: trained on QUADROTOR-DATASET-NANOBENCH (NanoBench, arXiv 2603.09908, BSD 3-Clause): 107 Crazyflie 2.1
    flights under Vicon at 100 Hz, converted to the 22-channel layout by datasets/QUADROTOR-DATASET-NANOBENCH/convert_nanobench.py.
    State from Vicon only; input = battery-compensated per-motor PWM through the CF2X mixer (hover thrust 0.96-1.00 x m g).'
  - 'SHAPE-DISJOINT split: train = multisine, circle, figure-eight, oval, linear ramp, staircase climb, random waypoints,
    battery-drain hover (89 flights x 10 s); test = helix, star, trefoil, lissajous (25 flights x 10 s). No trajectory family
    is shared between the splits.'
  - 'No synthetic observation noise: the measurements are the only data. The four likelihood sigmas (GP) are still learned
    from a neutral 0.3, so no noise level is supplied.'
  - 'Everything else is the published sigma=0.25 simulator recipe, unchanged: same window curriculum (K=50 then K=100, stride
    10, batch 256, 3000 steps per stage), same losses, same optimizers.'
report:
  enabled: true
  auto_generate: false
  generator: src.models.SE3_Quadrotor.comparision.generate_report
  exact_pages: 47
  output_name: model_report_47_pages.pdf
  title: PH-GP Lie-IMEX V2 JAX model report
  trajectory_count: 10
  random_seed: 42
  dpi: 150
  experiment_dirs: null
  evaluation_dataset: datasets/QUADROTOR-DATASET-NANOBENCH/NANOBENCH_CF2_10s_h0p01_clean.pkl
  controller_use_dissipation: true
