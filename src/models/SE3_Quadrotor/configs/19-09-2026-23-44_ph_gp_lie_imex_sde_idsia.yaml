experiment:
  root: experiments/quadrotor/train_runs
  name_suffix: gp-sde-idsia-rotor2-Gones-M2init1-S8-hgrowth-fp32-stage1-K50-3k-seed0-melon-heldout
  history_file: experiments/quadrotor/experiment_history.txt
  changes:
  - 'REAL-FLIGHT run on QUADROTOR-DATASET-IDSIA: the IDSIA nano-drone system identification benchmark (Busetto et al., Control
    Engineering Practice; github.com/idsia-robotics/nanodrone-sysid-benchmark), Crazyflie 2.1 Brushless under motion capture
    at 100 Hz, converted by datasets/QUADROTOR-DATASET-IDSIA/convert_idsia.py.'
  - 'The input is the MEASURED motor angular velocity from ESC telemetry, mapped to a wrench by the benchmark''s own published
    mixer (K_t = 3.72e-8, K_c = 7.74e-12, arm = 0.0353 m). This is why this set replaces NanoBench: there the input was a
    commanded PWM and the rotational channel was unidentifiable (yaw R^2 = 0.000, best fit needing a 20-30 ms motor lag);
    here the same test gives roll/pitch/yaw R^2 = 0.369/0.342/0.417 at zero lag and a parameter-free mass estimate of 44.78
    g against the published 45.0 g.'
  - 'SHAPE-DISJOINT split, the benchmark''s own protocol: train = chirp, random, square (44 flights x 10 s); test = melon
    (18 flights x 10 s), a trajectory shape that never occurs in training.'
  - No synthetic observation noise; the GP's four likelihood sigmas are still learned from a neutral 0.3, so no noise level
    is supplied to any model.
  - 'Otherwise the published sigma=0.25 simulator recipe is unchanged: same window curriculum (K=50 then K=100, stride 10,
    batch 256, 3000 steps per stage), same losses, same optimizers, same clipping.'
  - 'INPUT VARIANT rotor2: u_i = Omega_i^2 / Omega_hover^2 (four measured rotor speeds squared, ~1 at hover) instead of the
    pre-mixed wrench. The learned 6x4 control map g(x,R) now has to learn the mixer itself (per-motor thrust, yaw coefficient,
    cross-couplings); previously it could only rescale four channels fixed by the published K_t, K_c, arm. Motivation: the
    simulator comparison showed the unmodelled torque is as large as the modelled one, part of which is mixer error.'
  - Otherwise byte-identical to 19-09-2026-04-00 (the run scored in the benchmark protocol) with training.seed=0; compare
    against the wrench seeds 0/1/2 (runs 18-09-23-15, 19-09-15-20, 19-09-15-31).
  - 'rotor2 attempt 4, user-specified initialisation: control map level = all ones (6x4) with the GP mean zeroed (g starts
    exactly at ones), inverse_mass_2_initial_value = 1, dissipation_w_initial_value = 0.1, dissipation_v_initial_value = 0.1.
    Compare against the zero-G / M2=10 / Dw=0.1 / Dv=1 rotor2 runs (19-09-19-05/13, configs 23-10..12) and the wrench seeds.'
  - 'SDE VARIANT (ph_gp_lie_imex_sde_idsia): additive process noise Sigma = diag(sigma_v 1, sigma_omega 1) on the body twist,
    stochastic Lie-IMEX step (same Brownian increment in predictor and corrector; additive noise so Ito = Stratonovich), and
    a moment-matched predictive likelihood over S = 8 sample paths per window (each with its own weight sample and Brownian
    path): N(y; sample mean, sample variance + sigma_obs^2), attitude in the tangent space of the projected chordal mean.
    The spread of the samples enters the density, so sigma_v, sigma_omega get a data-fit signal (the pendulum SDE showed a
    per-sample NLL drives them to 0). Initial sigma_v = 0.05 m/s/sqrt(s), sigma_omega = 0.2 rad/s/sqrt(s). Recipe otherwise
    = the best rotor2 run (g = ones, M2^-1 = 1, Dw = Dv = 0.1).'
  - 'A: training.diverged_window_position_limit = 10.0 (the value of every ph_gp_lie_imex_idsia run; it was missing here because
    the config descends from the fp32 headline recipe). Two SDE attempts died at steps 176/191 with a finite objective and
    a NaN gradient; a finite-but-exploded stochastic sample path is not caught by the finiteness mask, and moment matching
    hides it in the variance. B: the training loop now dumps batch, parameters and per-leaf gradient norms on a non-finite
    gradient (diagnostic only).'
  - Pre-screen of diverging stochastic paths before the differentiable rollout (see _sde_components); initial_process_sigma_angular
    lowered 0.2 -> 0.05 rad/s/sqrt(s).
  - 'Pre-screen extended with body-twist limits (|omega| <= 100 rad/s, |v| <= 50 m/s): a finite rotational blow-up inside
    the 10 m position box still has an overflowing Jacobian.'
  - 'Horizon-growing observation variance: sigma_obs,b^2(h) = sigma_obs,b^2 + gamma_b t_h with learnable gamma_b (init 1e-4
    units^2/s), to let the predictive band widen with the horizon independently of the process scales, which drift down during
    training (coverage_p 0.998 at step 250 -> 0.87 at 3000 in the first SDE run). Otherwise identical to 19-09-2026-23-41
    (seed 0).'
