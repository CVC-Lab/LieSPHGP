experiment:
  root: experiments/quadrotor/train_runs
  name_suffix: levels-nll-noise0p5-K10-20k-prodigy-lvl0p5-HARDV2nogust-windows-only-Vlinear
  history_file: experiments/quadrotor/experiment_history.txt
  changes:
  - Learned levels (no dataset physics) for M1^-1, M2^-1, Dv, Dw, and g; GP residuals
    on top.
  - Position-only potential V(x); gravity learned inside the GP.
  - SE(3) negative log-likelihood with learned per-block sigma; KL spread over all
    training transitions (beta 1).
  - Windows of 11 points (K=10 transitions, 0.10 s) with stride 10 (no overlap), cut
    from the full flights; no multi-horizon term (main ph_gp_lie_imex trainer).
  - 20000 optimizer steps at h=0.01 s; evaluation every 500, checkpoint every 1000.
  - Per-subnetwork Prodigy (distance-adaptive, eta=0.5 because eta=1 diverged at step
    263 on this noise level, d0=1e-3, safeguard warm-up) on the 43 level scalars only;
    Adam 1e-3 for GP weight means, log-stds and likelihood sigmas; global-norm gradient
    clipping at 10.
  - 'Potential V(x) = lambda_V^T x + GP(x): learned linear level (zero init, outside
    the KL, own Prodigy group); GP features 20 Matern x 11 harmonics.'
  - Report controller allocates the wrench as u = pinv(M^-1 g)(M^-1 w) (gauge-invariant)
    instead of the paper's pinv(g) w.
  - 'Training data: QUADROTOR-DATASET-HARD-V2 regenerated with the wind-gust process
    noise disabled and the recovery kick torque included in the recorded wrench (ground-truth
    operators now reproduce the clean flights to 3 mm over 1 s); 50 train / 10 test
    flights of 10 s at h=0.01 s, absolute observation noise 0.5 pre-applied to the
    training flights, test split clean; 11-point windows (K=10) with stride 10: 5000
    training / 1000 test windows.'
report:
