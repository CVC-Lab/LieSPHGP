schema_version: 1
created_at: '2026-09-11T21:40:00-05:00'
model:
  name: ph_gp_lie_imex
  family: gp
  solver: lie-imex
  hidden_dim: null
  activation: null
  initialization_gain: null
  dissipation_enabled: true
  mass_epsilon: 0.01
  mass_factor_epsilon: null
  optional_subnetwork: null
data:
  dataset_path: datasets/QUADROTOR-DATASET-HARD-V2/HARDV2_CF2P_10s_h0p01_train-obs-noise-absolute0p1.pkl
  window_points: 11
  window_stride: 10
  time_varying_controls: true
  max_train_windows: null
  max_test_windows: null
  observation_noise_override: null
training:
  seed: 0
  total_steps: 20000
  batch_size: 256
  eval_every: 500
  checkpoint_every: 1000
  loss: se3-nll
  loss_scale: 1.0
  mass_pretrain_steps: 0
  mass_pretrain_learning_rate: 0.001
  mass_pretrain_samples: 4096
  initial_checkpoint: null
  resume_checkpoint: null
  long_horizon_flights: 8
  long_horizon_weight: 1.0
  long_horizon_schedule:
  - - 2000
    - 0.25
  - - 5000
    - 0.5
  - - 10000
    - 1.0
  long_horizon_truncation_steps: 50
  long_horizon_twist_bound: 50.0
  long_horizon_random_offsets: true
  long_horizon_test_seconds:
  - 1.0
  - 3.0
optimizer:
  name: prodigy-levels-per-subnetwork
  learning_rate: 0.001
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-08
  weight_decay: 0.0
  gradient_clip_norm: 10.0
  level_learning_rate: 0.5
gp:
  enabled: true
  kernel: matern
  matern_smoothness: 2.5
  model_backend: utils-gp-model
  matern_length_scale: 1.0
  period: 6.283185307179586
  periodic_length_scale: 0.5
  periodic_harmonics: 5
  periodic_dimension: 0
  mass_1_feature_count: 220
  mass_2_feature_budget: 220
  dissipation_v_feature_count: 225
  dissipation_w_feature_count: 220
  potential_position_feature_count: 20
  potential_rotation_feature_budget: 11
  potential_include_rotation: false
  control_position_feature_count: 20
  control_rotation_feature_budget: 11
  initial_log_standard_deviation: -5.0
  inverse_mass_2_initial_value: 1000.0
  dissipation_v_initial_value: 1.0
  dissipation_w_initial_value: 0.001
  kl_beta_max: 1.0
  kl_anneal_steps: 1000
  data_fit: se3-nll
  initial_observation_sigma: 0.1
  fixed_observation_sigma: null
  nll_squared_error_scale: 1.0
  direct_control_map: false
  optional_mean_subnetwork: null
runtime:
  device: gpu
  device_index: 0
  require_gpu: true
  jax_enable_x64: false
  matmul_precision: highest
  enable_compilation_cache: true
  compilation_cache_dir: experiments/quadrotor/.jax_cache
experiment:
  root: experiments/quadrotor/train_runs
  name_suffix: levels-nll-noise0p1-K10-20k-prodigy-lvl0p5-HARDV2nogust-1sec-multihorizon-w1-randoffset-Vlinear
  history_file: experiments/quadrotor/experiment_history.txt
  changes:
  - Learned levels (no dataset physics) for M1^-1, M2^-1, Dv, Dw, and g; GP residuals
    on top.
  - 'Potential V(x) = lambda_V^T x + GP(x): learned linear level (zero init, outside the
    KL, own Prodigy group), ported to the ph_gp_lie_imex_1sec trainer.'
  - SE(3) negative log-likelihood with learned per-block sigma (not fixed); KL spread over
    all training transitions (beta 1).
  - Windows of 11 points (K=10 transitions, 0.10 s) with stride 10 (no overlap), cut
    from the full 10 s flights (5000 training / 1000 clean test windows).
  - 20000 optimizer steps at h=0.01 s; evaluation every 500, checkpoint every 1000.
  - Per-subnetwork Prodigy (distance-adaptive, eta=0.5, d0=1e-3, safeguard warm-up) on
    the level scalars only; Adam 1e-3 for GP weight means, log-stds and likelihood sigmas;
    global-norm gradient clipping at 10.
  - 'Multi-horizon loss (ph_gp_lie_imex_1sec): windows plus a finite-masked, twist-bounded,
    50-step-truncated NLL on 8 long rollouts per step that start at RANDOM times inside
    the training flights; curriculum 0.25 s from step 2000, 0.5 s from 5000, 1 s from
    10000; weight 1.0 with 1000-step ramp; likelihood sigmas frozen inside the long term
    (they train through the window term).'
  - 1 s and 3 s open-loop position RMS and relative error on the clean test flights logged
    at every evaluation (test_long_* and test_long3s_* in training_stats.npz).
  - 'Training data: QUADROTOR-DATASET-HARD-V2 regenerated with the wind-gust process noise
    disabled and the recovery kick torque included in the recorded wrench; 50 train / 10
    test flights of 10 s at h=0.01 s, absolute observation noise 0.1 pre-applied to the
    training flights, test split clean.'
  - 'Report: open-loop pages use the 3 s clean 240 Hz PID reference
    (D0_..._3s_seed0.pkl, report.evaluation_dataset); controller allocation
    u = pinv(M^-1 g)(M^-1 w).'
report:
  enabled: true
  auto_generate: true
  generator: src.models.SE3_Quadrotor.comparision.generate_report
  evaluation_dataset: datasets/data/pybullet_quadrotor/D0_CF2P_PID_contact-free_nonlinear-damping-c0p5_3s_seed0.pkl
  exact_pages: 47
  output_name: model_report_47_pages.pdf
  title: PH-GP Lie-IMEX V2 JAX model report
  trajectory_count: 10
  random_seed: 42
  dpi: 150
  experiment_dirs: null
