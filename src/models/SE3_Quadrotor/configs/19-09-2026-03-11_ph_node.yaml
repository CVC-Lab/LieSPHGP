schema_version: 1
created_at: '2026-09-19T03:00:00-05:00'
model:
  name: ph_node
  family: nn
  solver: rk4
  hidden_dim: 64
  activation: tanh
  initialization_gain: 0.001
  dissipation_enabled: true
  mass_epsilon: 0.01
  mass_factor_epsilon: 1.0
  optional_subnetwork: null
data:
  dataset_path: datasets/QUADROTOR-DATASET-NANOBENCH/NANOBENCH_CF2_10s_h0p01_clean.pkl
  window_points: 101
  window_stride: 10
  time_varying_controls: true
  max_train_windows: null
  max_test_windows: null
  observation_noise_override: null
training:
  seed: 0
  total_steps: 3000
  batch_size: 256
  eval_every: 250
  checkpoint_every: 500
  loss: trajectory-mse
  loss_scale: 1.0
  mass_pretrain_steps: 200
  mass_pretrain_learning_rate: 0.001
  mass_pretrain_samples: 4096
  initial_checkpoint: __PREV_CHECKPOINT__
  resume_checkpoint: null
optimizer:
  name: adam
  learning_rate: 0.0005
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-08
  weight_decay: 0.0
  gradient_clip_norm: null
  level_learning_rate: 0.0
gp:
  enabled: false
  kernel: null
  matern_smoothness: null
  model_backend: null
  matern_length_scale: null
  period: null
  periodic_length_scale: null
  periodic_harmonics: null
  periodic_dimension: null
  mass_1_feature_count: null
  mass_2_feature_budget: null
  dissipation_v_feature_count: null
  dissipation_w_feature_count: null
  potential_position_feature_count: null
  potential_rotation_feature_budget: null
  potential_include_rotation: null
  control_position_feature_count: null
  control_rotation_feature_budget: null
  initial_log_standard_deviation: null
  kl_beta_max: null
  kl_anneal_steps: null
  data_fit: null
  initial_observation_sigma: null
  fixed_observation_sigma: null
  nll_squared_error_scale: null
  direct_control_map: null
  optional_mean_subnetwork: null
  inverse_mass_2_initial_value: 1.0
  dissipation_v_initial_value: 1.0
  dissipation_w_initial_value: 1.0
runtime:
  device: gpu
  device_index: 0
  require_gpu: true
  jax_enable_x64: false
  matmul_precision: highest
  enable_compilation_cache: true
  compilation_cache_dir: experiments/quadrotor/.jax_cache
experiment:
  root: experiments/quadrotor/train_runs
  name_suffix: phnode-rk4-NANOBENCH-real-stage2-K100-3k-chain-shapedisjoint
  history_file: experiments/quadrotor/experiment_history.txt
  changes:
  - 'REAL-FLIGHT run: trained on QUADROTOR-DATASET-NANOBENCH (NanoBench, arXiv 2603.09908, BSD 3-Clause): 107 Crazyflie 2.1
    flights under Vicon at 100 Hz, converted to the 22-channel layout by datasets/QUADROTOR-DATASET-NANOBENCH/convert_nanobench.py.
    State from Vicon only; input = battery-compensated per-motor PWM through the CF2X mixer (hover thrust 0.96-1.00 x m g).'
  - 'SHAPE-DISJOINT split: train = multisine, circle, figure-eight, oval, linear ramp, staircase climb, random waypoints,
    battery-drain hover (89 flights x 10 s); test = helix, star, trefoil, lissajous (25 flights x 10 s). No trajectory family
    is shared between the splits.'
  - 'No synthetic observation noise: the measurements are the only data. The four likelihood sigmas (GP) are still learned
    from a neutral 0.3, so no noise level is supplied.'
  - 'Everything else is the published sigma=0.25 simulator recipe, unchanged: same window curriculum (K=50 then K=100, stride
    10, batch 256, 3000 steps per stage), same losses, same optimizers.'
report:
  enabled: false
  auto_generate: false
  generator: src.models.SE3_Quadrotor.comparision.generate_report
  exact_pages: 47
  output_name: model_report_47_pages.pdf
  title: PH-NN RK4 JAX model report
  trajectory_count: 10
  random_seed: 42
  dpi: 150
  experiment_dirs: null
  posterior_samples: 0
  evaluation_dataset: datasets/QUADROTOR-DATASET-NANOBENCH/NANOBENCH_CF2_10s_h0p01_clean.pkl
