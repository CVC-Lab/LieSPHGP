runtime:
  device: gpu
  device_index: 0
  require_gpu: true
  jax_enable_x64: false
  matmul_precision: highest
  enable_compilation_cache: true
  compilation_cache_dir: experiments/quadrotor/.jax_cache
experiment:
  root: experiments/quadrotor/train_runs
  name_suffix: phnode-rk4-IDSIA-stage1-K50-3k-BODYTWIST-Dv_vb-Dw_wb
  history_file: experiments/quadrotor/experiment_history.txt
  changes:
  - 'ISOLATION RUN. Published PH-NODE feeds Dv the position x and Dw the flattened rotation R; PH-NN-LieIMEX feeds them the
    body velocity v_b and body rate omega_b. Both differences were present in the IDSIA comparison, so the divergence of PH-NODE-RK4
    could not be attributed to the explicit integrator alone. This run switches ONLY the dissipation inputs (model.dissipation_inputs:
    body-twist), leaving RK4 and everything else as published.'
  - If it still diverges -> the integrator is the cause. If it trains -> the dissipation parameterisation was.
  - 'This run: phnode-rk4-IDSIA-stage1-K50-3k-BODYTWIST-Dv_vb-Dw_wb.'
report:
