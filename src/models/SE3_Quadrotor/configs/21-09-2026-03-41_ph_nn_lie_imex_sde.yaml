experiment:
  changes:
  - PH-NODE (Duong & Atanasov SE(3) Hamiltonian ODE) as published, MLP subnetworks, tanh, initialization gain 0.001, trajectory
    MSE, Adam 5e-4, no gradient clipping, no learned sigma, no latent initial state.
  - 'ONLY change to the published model: the dissipation subnetworks take body velocity and body rate, Dv(v_b) and Dw(omega_b),
    instead of position and rotation, so they can represent the simulator''s speed-dependent damping.'
  - 'Integrator: second-order Lie-IMEX (replaces RK4), identical to the integrator used by our GP model.'
  - 'Data: HARD-V5 nonlinear, observation noise 0.25, the exact file used for our models; windows of 101 points with stride
    10, two-stage curriculum K=50 then K=100, matching how our model sees the data.'
  - Hidden width 64; report generation disabled (the shared report generator cannot read NN checkpoints).
  - 'This run: nn-lieimex-w64-noise0p25-HARDV5-stage2-K100-3k-Dv_vb-Dw_wb-mse-published.'
  - PH-NN-LieIMEX on the windy simulator (OU gust, 10 % of weight, unobserved; observation noise 0.25), the same dataset as
    the NODE / GP-ODE / GP-SDE trio, published stage-1 recipe with only the dataset path changed. ODE half of the requested
    NN ODE-vs-SDE pair.
  - 'PH-NN-LieIMEX-SDE (new package ph_nn_lie_imex_sde): same six MLP subnetworks and Lie-IMEX integrator, plus two learned
    process-noise scales on the body twist and four learned observation scales, trained with the moment-matched predictive
    likelihood over S sample paths (the mechanism that makes a noise scale identifiable; a plain MSE gives sigma no data-fit
    signal). This package has NO latent initial-state correction, which on the GP side was what prevented the process noise
    from learning the wind. sde.enabled=false keeps the same likelihood with one noise-free path: the matched control that
    separates ''MSE -> NLL'' from ''no noise -> noise''.'
