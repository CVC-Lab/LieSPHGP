  changes:
  - Identical to 24-09-2026-12-01_ph_nn_lie_imex.yaml (PH-NN-LieIMEX-ODE-Prodigy, one Prodigy per subnetwork) except optimizer.learning_rate
    1.0 -> 0.1.
  - 'Why: with eta = 1.0 Prodigy''s effective step eta*d_t settled 4-26x above the stable Adam rate 5e-4 (V 0.0129, Dv/Dw
    0.0075, g 0.0053, M2 0.0037, M1 0.0019); d_t is non-decreasing so it cannot back off, and both eta = 1.0 runs went NaN
    (h=0.01 at step 1328, h=0.005 at step 290). eta = 0.1 puts the effective steps at 0.4-2.6x Adam while keeping a separate
    step size per subnetwork.'
  - 'This run: nn-lieimex-PRODIGY-lr0p1-w64-IDSIA-rotor2-stage1-K50-3k-nopriors-fp32-nopretrain-substeps2-h0p005.'
