# ─────────────────────────────────────────────────────────────────────────────
# SE(3) quadrotor — DETERMINISTIC (pH-ODE) environment config
#
#   Every stochastic channel is off, so the env realises the deterministic
#   port-Hamiltonian ODE of notes/quadrotor-se3-ph-system.md §6:
#
#       xdot = (J(x) - R) dH/dx + G u
#
#   Use this for: integrator/conservation checks, IDA-PBC controller work, and
#   the ODE baselines (ph_nn_ode, ph_gp_ode).
#
# Keys map 1:1 onto quadrotor_se3.__init__ (see §22 of the notes for the full
# argument reference).  Keys beginning with "_" are metadata and are ignored.
# Any key that is not a constructor argument is a hard error, so typos surface
# immediately rather than being silently dropped.
#
# Override any value from the command line, e.g.
#   --external_force_type random --external_force_std 1.5
# ─────────────────────────────────────────────────────────────────────────────
_name: quadrotor_se3_ode
_description: Deterministic SE(3) quadrotor - no Brownian channels, no obs noise.

# ── Rigid body (§4.1, §22.1) ────────────────────────────────────────────────
g: 9.81                     # gravity  [m/s^2]
m: 1.0                      # mass  [kg]           -> mI3 block of Mcal
J_diag: [0.5, 0.5, 1.0]     # body inertia diag    -> J block of Mcal
arm: 1.0                    # rotor arm [m]; lever a = arm/sqrt(2) in G
dt: 0.05                    # env step [s]; 10 fixed substeps of h = dt/10

# ── Rotor / damping coefficients (§7, §8, §22.2) ────────────────────────────
# std = 0 pins each coefficient to its mean: required for a deterministic env.
kf_coeff: 1.0               # thrust gain k_f
kf_std: 0.0
km_coeff: 0.1               # yaw reaction-drag gain k_m
km_std: 0.0
linear_damping_coeff: 0.5   # d_lin  (project convention: friction 0.5)
linear_damping_std: 0.0
angular_damping_coeff: 0.5  # d_ang
angular_damping_std: 0.0
resample_coeffs_every_step: false   # irrelevant while all stds are 0

# ── Wind (§9, §22.3) ────────────────────────────────────────────────────────
# Deterministic wind is left OFF (amplitude 0): the learned models have no w(t)
# port and would otherwise absorb it into V and D (§18.4).  Setting
# external_force_std > 0 keeps the system an ODE - it is a deterministic
# forcing term, not a diffusion - so it is safe to enable for control studies.
external_force_type: constant
external_force_std: 0.0
external_force_direction: [1.0, 0.0, 0.0]
wind_force_std: 0.0         # sigma_f  - MUST stay 0 for an ODE
wind_torque_std: 0.0        # sigma_tau - MUST stay 0 for an ODE

# ── Observation / action API (§15.1, §22.4) ─────────────────────────────────
obs_noise_std: 0.0          # clean observations for the deterministic reference
max_u: 25.0                 # action_space bound only - the env never clips u
ori_rep: rotmat             # only "rotmat" is supported

# ── Rendering and seeding (§22.5) ───────────────────────────────────────────
render_mode: null           # null | human | rgb_array
render_backend: pybullet    # pybullet | matplotlib
seed: 0
