environment:
  drone_model: CF2P
  physics: PYB
  physics_hz: 1000
  sample_hz: 100
  contact_free: true
  builtin_damping_coefficient: 0.5
actuator:
  input_mode: wrench
  motor_gain_spread: 0.0
  motor_lag_seconds: 0.0
flight:
  duration_seconds: 10.0
initial_state:
  position_box:
    x:
    - -2.0
    - 2.0
    y:
    - -2.0
    - 2.0
    z:
    - 1.5
    - 4.0
  max_tilt_deg: 30
  max_speed: 2.0
  max_angular_rate: 1.0
envelope:
  position_box:
    x:
    - -3.5
    - 3.5
    y:
    - -3.5
    - 3.5
    z:
    - 0.5
    - 5.0
  max_tilt_deg: 45
  max_speed: 3.5
  max_angular_rate: 6.0
controller:
  type: dsl_pid
  gain_scale: 0.5
manoeuvres:
  segments_per_flight:
  - 3
  - 5
  training_config: datasets/QUADROTOR-DATASET-HARD/HARD_CF2P_10s_h0p01_config_used.yaml
  library:
    dash:
      duration:
      - 2.0
      - 3.0
      speed:
      - 0.5
      - 3.2
      weight: 2.0
    thrust_pulse:
      duration:
      - 1.8
      - 2.5
      cut_seconds:
      - 0.35
      - 0.5
      thrust_fraction:
      - 0.25
      - 0.45
      min_altitude: 1.5
      kp: 0.0015
      kd: 0.00027
      weight: 2.0
    disturbed_hover:
      duration:
      - 1.0
      - 2.0
      gust_multiplier: 3.0
      weight: 1.0
    slalom:
      duration:
      - 3.0
      - 4.0
      speed:
      - 2.0
      - 3.4
      amplitude:
      - 0.3
      - 0.5
      period:
      - 2.5
      - 3.5
      weight: 1.2
    helix:
      duration:
      - 3.0
      - 4.0
      radius:
      - 1.5
      - 2.0
      speed:
      - 2.0
      - 3.4
      climb_rate:
      - 0.3
      - 0.5
      weight: 1.5
    chirp:
      duration:
      - 3.0
      - 4.0
      amplitude:
      - 0.5
      - 1.0
      yaw_amplitude:
      - 0.2
      - 0.4
      f0: 0.2
      f1: 1.5
      weight: 1.0
    bounce:
      duration:
      - 3.0
      - 4.0
      height:
      - 0.3
      - 0.6
      period:
      - 1.0
      - 1.6
      weight: 1.0
    tumble:
      duration:
      - 2.0
      - 3.0
      rate:
      - 3.0
      - 5.0
      kick_seconds: 0.1
      gap_seconds: 0.4
      weight: 0.7
gusts:
  enabled: false
  time_constant_seconds: 0.5
  sigma_fraction_of_weight: 0.05
gates:
  max_tilt_deg: 90
  min_altitude: 0.3
  envelope_margin: 0.5
  max_saturation_fraction: 0.08
  max_attempts: 20
splits:
  eval_seeds:
  - 498
  - 499
  flights_per_seed: 10
  flight_seed_base: 7000000
noise:
  absolute_levels:
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  sensor:
    enabled: false
audits:
  horizons_seconds:
  - 0.1
  - 0.25
  - 0.5
  - 1.0
  - 2.0
output:
  directory: datasets/QUADROTOR-DATASET-EVALSET
  tag: EVALSET
  window_points: 6
  window_stride: 5
  write_pdf: true
  pdf_example_flights: 6
_note: 'EVALSET = unseen-shape evaluation flights for models trained on QUADROTOR-DATASET-HARD.
  Same plant, PID (gain 0.5), envelope and gates as HARD-V6 (max_speed 3.5, saturation
  gate 0.08). Library: dash, thrust_pulse, disturbed_hover (hover hold: gusts disabled),
  slalom, helix, chirp, bounce, tumble - none of these names appears in the HARD training
  library (asserted). 20 clean flights, seeds 498-499, stored under heldout_trajectories;
  no noise variants.'
