_note: 'QUADROTOR-DATASET-WINDSDE (low wind): the WIND dataset (same plant CF2P, DSL
  PID, manoeuvre libraries, seeds, gates, splits) with (1) LINEAR damping c = 0.5
  (F = -c m v, tau = -c J omega) and (2) a WHITE, STATE-DEPENDENT wind: body force
  m*sigma_a(x)*dW and torque J*sigma_alpha(x)*dW with sigma_a = linear_sigma*(1+speed_gain*|v_b|),
  sigma_alpha = angular_sigma*(1+rate_gain*|omega_b|). The true drift and the true
  diffusion are both known, so every learned operator, including the SDE diffusion,
  can be scored against ground truth. Levels chosen so the DSL PID survives white
  noise: at linear_sigma 0.5 the noise itself crashes the vehicle. The wind draw is
  held for 0.01 s (one sample, the models'' step), so each sample carries exactly
  one Wiener increment. Envelope margin widened 0.5 -> 1.5 m because linear damping
  alone makes ~1/3 of no-wind flights overshoot the box; measured selection bias of
  the remaining rejections on the noise: std 0.998/1.002. The held-out disturbed_hover
  segment''s gust_multiplier is set to 1 so the diffusion is a function of the state
  alone on every split.'
actuator:
  input_mode: wrench
  motor_gain_spread: 0.0
  motor_lag_seconds: 0.0
audits:
  horizons_seconds:
  - 0.1
  - 0.25
  - 0.5
  - 1.0
  - 2.0
controller:
  gain_scale: 0.5
  type: dsl_pid
envelope:
  max_angular_rate: 6.0
  max_speed: 3.0
  max_tilt_deg: 45
  position_box:
    x:
    - -3.5
    - 3.5
    y:
    - -3.5
    - 3.5
    z:
    - 0.5
    - 5.0
environment:
  builtin_damping_coefficient: 0.5
  contact_free: true
  drone_model: CF2P
  physics: PYB
  physics_hz: 1000
  sample_hz: 100
  damping_law: linear
flight:
  duration_seconds: 10.0
gates:
  envelope_margin: 1.5
  max_attempts: 20
  max_saturation_fraction: 0.05
  max_tilt_deg: 90
  min_altitude: 0.3
gusts:
  enabled: true
  model: white_state_dependent
  linear_sigma: 0.1
  speed_gain: 0.5
  angular_sigma: 0.15
  rate_gain: 0.25
  hold_seconds: 0.01
initial_state:
  max_angular_rate: 1.0
  max_speed: 2.0
  max_tilt_deg: 30
  position_box:
    x:
    - -2.0
    - 2.0
    y:
    - -2.0
    - 2.0
    z:
    - 1.5
    - 4.0
manoeuvres:
  library:
    aggressive_recovery:
      duration:
      - 1.5
      - 2.0
      kick_seconds: 0.1
      rate:
      - 3.0
      - 5.0
      weight: 0.7
    circle:
      duration:
      - 3.0
      - 4.0
      radius:
      - 1.0
      - 2.0
      speed:
      - 1.0
      - 3.0
      weight: 1.0
    coast:
      duration:
      - 1.5
      - 2.5
      entry_radius: 1.5
      entry_seconds: 2.0
      entry_speed:
      - 2.0
      - 3.0
      kd: 0.00027
      kp: 0.0015
      weight: 1.3
    coast_yaw:
      duration:
      - 1.5
      - 2.5
      entry_radius: 1.5
      entry_seconds: 1.5
      entry_speed:
      - 1.5
      - 2.5
      kd: 0.00027
      kick_seconds: 0.1
      kp: 0.0015
      rate:
      - 2.0
      - 4.0
      weight: 0.8
    figure_eight:
      duration:
      - 3.0
      - 4.0
      radius:
      - 1.0
      - 2.0
      speed:
      - 1.0
      - 3.0
      weight: 1.0
    vertical_step:
      duration:
      - 1.5
      - 2.0
      height:
      - 1.5
      - 2.5
      weight: 0.8
    waypoint_hop:
      duration:
      - 1.5
      - 2.5
      max_distance: 3.5
      weight: 1.0
    yaw_kick:
      duration:
      - 1.5
      - 2.5
      kick_seconds: 0.1
      rate:
      - 3.0
      - 6.0
      weight: 1.2
    yaw_turn:
      duration:
      - 1.0
      - 2.0
      rate:
      - 1.0
      - 4.0
      weight: 1.0
  segments_per_flight:
  - 3
  - 5
  heldout_library:
    bounce:
      duration:
      - 3.0
      - 4.0
      height:
      - 0.3
      - 0.6
      period:
      - 1.0
      - 1.6
      weight: 1.0
    chirp:
      amplitude:
      - 0.5
      - 1.0
      duration:
      - 3.0
      - 4.0
      f0: 0.2
      f1: 1.5
      weight: 1.0
      yaw_amplitude:
      - 0.2
      - 0.4
    dash:
      duration:
      - 2.0
      - 3.0
      speed:
      - 0.5
      - 3.2
      weight: 2.0
    disturbed_hover:
      duration:
      - 1.0
      - 2.0
      gust_multiplier: 1.0
      weight: 1.0
    helix:
      climb_rate:
      - 0.3
      - 0.5
      duration:
      - 3.0
      - 4.0
      radius:
      - 1.5
      - 2.0
      speed:
      - 2.0
      - 3.4
      weight: 1.5
    slalom:
      amplitude:
      - 0.3
      - 0.5
      duration:
      - 3.0
      - 4.0
      period:
      - 2.5
      - 3.5
      speed:
      - 2.0
      - 3.4
      weight: 1.2
    thrust_pulse:
      cut_seconds:
      - 0.35
      - 0.5
      duration:
      - 1.8
      - 2.5
      kd: 0.00027
      kp: 0.0015
      min_altitude: 1.5
      thrust_fraction:
      - 0.25
      - 0.45
      weight: 2.0
    tumble:
      duration:
      - 2.0
      - 3.0
      gap_seconds: 0.4
      kick_seconds: 0.1
      rate:
      - 3.0
      - 5.0
      weight: 0.7
noise:
  absolute_levels:
  - 0.25
  sensor:
    attitude_sigma_deg: 1.0
    enabled: false
    gyro_bias_random_walk: 0.0001
    gyro_white_sigma: 0.01
    position_sigma: 0.005
    savitzky_golay_window: 7
    velocity_from: central_difference
  test_noise_seed: 1999
  train_noise_seed: 0
output:
  directory: datasets/QUADROTOR-DATASET-WINDSDE
  tag: WINDSDELO
  window_points: 6
  window_stride: 5
  write_pdf: true
  pdf_example_flights: 4
splits:
  train_seeds:
  - 300
  - 301
  - 302
  - 303
  - 304
  val_seeds:
  - 399
  heldout_seeds:
  - 499
  flights_per_seed: 10
  flight_seed_base: 7000000
