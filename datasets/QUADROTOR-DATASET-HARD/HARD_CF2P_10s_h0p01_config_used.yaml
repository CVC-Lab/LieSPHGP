environment:
  drone_model: CF2P
  physics: PYB
  physics_hz: 1000
  sample_hz: 100
  contact_free: true
  builtin_damping_coefficient: 0.5
actuator:
  input_mode: wrench
  motor_gain_spread: 0.0
  motor_lag_seconds: 0.0
flight:
  duration_seconds: 10.0
initial_state:
  position_box:
    x:
    - -2.0
    - 2.0
    y:
    - -2.0
    - 2.0
    z:
    - 1.5
    - 4.0
  max_tilt_deg: 30
  max_speed: 2.0
  max_angular_rate: 1.0
envelope:
  position_box:
    x:
    - -3.5
    - 3.5
    y:
    - -3.5
    - 3.5
    z:
    - 0.5
    - 5.0
  max_tilt_deg: 45
  max_speed: 3.0
  max_angular_rate: 6.0
controller:
  type: dsl_pid
  gain_scale: 0.5
manoeuvres:
  segments_per_flight:
  - 3
  - 5
  library:
    waypoint_hop:
      duration:
      - 1.5
      - 2.5
      max_distance: 3.5
      weight: 1.0
    figure_eight:
      duration:
      - 3.0
      - 4.0
      radius:
      - 1.0
      - 2.0
      speed:
      - 1.0
      - 3.0
      weight: 1.0
    circle:
      duration:
      - 3.0
      - 4.0
      radius:
      - 1.0
      - 2.0
      speed:
      - 1.0
      - 3.0
      weight: 1.0
    vertical_step:
      duration:
      - 1.5
      - 2.0
      height:
      - 1.5
      - 2.5
      weight: 0.8
    yaw_turn:
      duration:
      - 1.0
      - 2.0
      rate:
      - 1.0
      - 4.0
      weight: 1.0
    aggressive_recovery:
      duration:
      - 1.5
      - 2.0
      rate:
      - 3.0
      - 5.0
      kick_seconds: 0.1
      weight: 0.7
    yaw_kick:
      duration:
      - 1.5
      - 2.5
      rate:
      - 3.0
      - 6.0
      kick_seconds: 0.1
      weight: 1.2
    coast:
      duration:
      - 1.5
      - 2.5
      entry_speed:
      - 2.0
      - 3.0
      entry_seconds: 2.0
      entry_radius: 1.5
      kp: 0.0015
      kd: 0.00027
      weight: 1.3
    coast_yaw:
      duration:
      - 1.5
      - 2.5
      rate:
      - 2.0
      - 4.0
      kick_seconds: 0.1
      entry_speed:
      - 1.5
      - 2.5
      entry_seconds: 1.5
      entry_radius: 1.5
      kp: 0.0015
      kd: 0.00027
      weight: 0.8
gusts:
  enabled: false
  time_constant_seconds: 0.5
  sigma_fraction_of_weight: 0.05
gates:
  max_tilt_deg: 90
  min_altitude: 0.3
  envelope_margin: 0.5
  max_saturation_fraction: 0.05
  max_attempts: 20
splits:
  train_seeds:
  - 300
  - 301
  - 302
  - 303
  - 304
  test_seeds:
  - 399
  flights_per_seed: 10
  flight_seed_base: 7000000
noise:
  absolute_levels:
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  train_noise_seed: 0
  test_noise_seed: 1999
  sensor:
    enabled: true
    position_sigma: 0.005
    attitude_sigma_deg: 1.0
    velocity_from: central_difference
    savitzky_golay_window: 7
    gyro_white_sigma: 0.01
    gyro_bias_random_walk: 0.0001
audits:
  horizons_seconds:
  - 0.1
  - 0.25
  - 0.5
  - 1.0
  - 2.0
output:
  directory: datasets/QUADROTOR-DATASET-HARD
  tag: HARD
  window_points: 6
  window_stride: 5
  write_pdf: true
  pdf_example_flights: 4
_note: 'HARD = the former HARD-V5 train/test data, byte-identical pickles (files renamed
  HARDV5_* -> HARD_*, settings inside still say HARDV5). disturbed_hover (weight 0,
  never drawn) removed from this config and moved to the EVALSET library. Library:
  waypoint_hop, figure_eight, circle, vertical_step, yaw_turn, aggressive_recovery,
  yaw_kick, coast, coast_yaw. Original note: HARD-V5 = HARD-V4 shifted to 1-3 m/s:
  figure-eight/circle speed 1-3 m/s radius 1-2 m, hops up to 3.5 m in 1.5-2.5 s, vertical
  steps 1.5-2.5 m, coasts entered at 2-3 m/s and cut at 1.5-2.5 s, no hover segment,
  initial speed up to 2 m/s, envelope +-3.5 m.'
