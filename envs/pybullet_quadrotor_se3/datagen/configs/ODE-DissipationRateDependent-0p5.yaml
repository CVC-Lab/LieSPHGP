# Config for generate_dataset.py (PyBullet quadrotor datasets) -> datasets/QUADROTOR-DATASET-ODE-DissipationRateDependent-0p5/
# Run:    python envs/pybullet_quadrotor_se3/datagen/generate_dataset.py --config envs/pybullet_quadrotor_se3/datagen/configs/ODE-DissipationRateDependent-0p5.yaml
# Output: datasets/QUADROTOR-DATASET-<name>/<name>_CF2P_<T>s_h<h>_<variant>.pkl   (refuses to overwrite; add --force)
# Notation: [a, b] = drawn uniformly from a to b.  v_b, w_b = body linear / angular velocity.

name: ODE-DissipationRateDependent-0p5  # any text -> folder and file names

trajectory_set: hard+eval         # hard      : train + test splits, hard library (+ noisy copies)
                                  # eval      : one clean split, eval library (unseen shapes), key heldout_trajectories
                                  # hard+eval : both of the above

# Damping (friction), set separately for the linear and the angular channel.
dissipation:
  linear:
    type: rate_dependent          # none | constant: -c m v_b | rate_dependent: -c m (1+|v_b|) v_b | pybullet_builtin
    c: 0.5                        # coefficient (1/s)
  angular:
    type: rate_dependent          # none | constant: -c J w_b | rate_dependent: -c J (1+|w_b|) w_b | pybullet_builtin
    c: 0.5
                                  # pybullet_builtin = PyBullet's own damping; identical to rate_dependent

# Wind = the SDE noise term, set separately for the linear and the angular channel.
diffusion:
  hold_seconds: 0.01              # constant / dependent types: new random draw every hold_seconds
  linear:
    type: none                    # none | constant: dv_b += sigma dW | rate_dependent: dv_b += sigma (1+gain |v_b|) dW | ou
    sigma: 0.25                   # constant, rate_dependent (m s^-1.5)
    gain: 0.5                     # rate_dependent only
    sigma_fraction_of_weight: 0.1 # ou only: gust force std / (m g)
    time_constant_seconds: 0.5    # ou only: gust correlation time
  angular:
    type: none                    # none | constant: dw_b += sigma dW | rate_dependent: dw_b += sigma (1+gain |w_b|) dW | ou
    sigma: 0.4                    # constant, rate_dependent (rad s^-1.5); ou: angular-acceleration std (rad s^-2)
    gain: 0.25                    # rate_dependent only
    time_constant_seconds: 0.5    # ou only

# How the kick torque (a short external shove in kick segments) is written into the recorded control u.
recording:
  kick_torque: interval_mean      # interval_mean: average over the sample (correct) | last_step: value at its end (old)
  kick_alignment: sample          # sample: kicks start and end on sample boundaries, u exact | none: old timing

seeds:
  train: [300, 301, 302, 303, 304]  # one seed per group of flights_per_seed flights
  test: [399]
  eval: [498, 499]
  flights_per_seed: 10
  flight_seed_base: 7000000       # flight seed = base + 1000*seed + index + 100000*attempt

plant:
  drone_model: CF2P               # CF2P only (the recorded wrench assumes its + frame)
  physics: PYB                    # PYB (tested) | DYN, PYB_GND, PYB_DRAG, PYB_DW, PYB_GND_DRAG_DW (gym-pybullet-drones, untested)
  physics_hz: 1000                # simulation rate
  sample_hz: 100                  # recording and PID rate; must divide physics_hz
  contact_free: true              # true: no ground plane, zero contact friction
actuator:
  input_mode: wrench              # wrench | motor: label in settings only; u is always the wrench [T, tau]
  motor_gain_spread: 0.0          # per-motor thrust gain error, drawn in [1-s, 1+s]
  motor_lag_seconds: 0.0          # first-order motor lag; 0 = none
controller:
  type: dsl_pid                   # dsl_pid only (label)
  gain_scale: 0.5                 # multiplies every DSL PID gain
flight:
  duration_seconds: 10.0
initial_state:                    # random start of each flight
  position_box:
    x: [-2.0, 2.0]
    y: [-2.0, 2.0]
    z: [1.5, 4.0]
  max_tilt_deg: 30
  max_speed: 2.0
  max_angular_rate: 1.0
envelope:                         # flight box: targets are clipped to it; the speed/tilt/rate limits only mark the PDF plots
  position_box:
    x: [-3.5, 3.5]
    y: [-3.5, 3.5]
    z: [0.5, 5.0]
  max_tilt_deg: 45
  max_speed: 3.0
  max_angular_rate: 6.0
gates:                            # a flight breaking any gate is redrawn (next attempt)
  max_tilt_deg: 90
  min_altitude: 0.3
  envelope_margin: 1.5            # max distance outside the envelope box (m)
  max_saturation_fraction: 0.05   # max share of steps with a motor at its limit
  max_attempts: 20

# Manoeuvre segments. Each flight chains random segments (chosen by weight) until the flight is full.
# Every segment: duration (s), weight (relative chance). The two libraries must not share a name.
#   waypoint_hop  fly to a random point (max_distance m)    figure_eight, circle  radius (m), speed (m/s)
#   vertical_step climb or drop by height (m)              yaw_turn              turn at rate (rad/s)
#   aggressive_recovery / yaw_kick  shove of rate (rad/s) over kick_seconds, then PID recovery
#   coast / coast_yaw  motors hold hover thrust, no position control (coast_yaw adds a yaw shove); entry_* = run-up circle,
#                      kp, kd = level-hold PD gains
#   dash  straight run at speed     slalom  run with a side-to-side wave (amplitude m, period s)
#   helix  climbing circle (climb_rate m/s)   chirp  sideways + yaw wave, frequency f0 -> f1 Hz   bounce  height square wave
#   thrust_pulse  thrust drops to thrust_fraction of weight for cut_seconds, then the same amount above
#   disturbed_hover  hover; gust_multiplier scales the wind   tumble  two shoves on different axes, gap_seconds apart
libraries:
  hard:
    waypoint_hop:
      duration: [1.5, 2.5]
      max_distance: 3.5
      weight: 1.0
    figure_eight:
      duration: [3.0, 4.0]
      radius: [1.0, 2.0]
      speed: [1.0, 3.0]
      weight: 1.0
    circle:
      duration: [3.0, 4.0]
      radius: [1.0, 2.0]
      speed: [1.0, 3.0]
      weight: 1.0
    vertical_step:
      duration: [1.5, 2.0]
      height: [1.5, 2.5]
      weight: 0.8
    yaw_turn:
      duration: [1.0, 2.0]
      rate: [1.0, 4.0]
      weight: 1.0
    aggressive_recovery:
      duration: [1.5, 2.0]
      rate: [3.0, 5.0]
      kick_seconds: 0.1
      weight: 0.7
    yaw_kick:
      duration: [1.5, 2.5]
      rate: [3.0, 6.0]
      kick_seconds: 0.1
      weight: 1.2
    coast:
      duration: [1.5, 2.5]
      entry_speed: [2.0, 3.0]
      entry_seconds: 2.0
      entry_radius: 1.5
      kp: 0.0015
      kd: 0.00027
      weight: 1.3
    coast_yaw:
      duration: [1.5, 2.5]
      rate: [2.0, 4.0]
      kick_seconds: 0.1
      entry_speed: [1.5, 2.5]
      entry_seconds: 1.5
      entry_radius: 1.5
      kp: 0.0015
      kd: 0.00027
      weight: 0.8
  eval:
    dash:
      duration: [2.0, 3.0]
      speed: [0.5, 3.2]
      weight: 2.0
    thrust_pulse:
      duration: [1.8, 2.5]
      cut_seconds: [0.35, 0.5]
      thrust_fraction: [0.25, 0.45]
      min_altitude: 1.5
      kp: 0.0015
      kd: 0.00027
      weight: 2.0
    disturbed_hover:
      duration: [1.0, 2.0]
      gust_multiplier: 3.0
      weight: 1.0
    slalom:
      duration: [3.0, 4.0]
      speed: [2.0, 3.4]
      amplitude: [0.3, 0.5]
      period: [2.5, 3.5]
      weight: 1.2
    helix:
      duration: [3.0, 4.0]
      radius: [1.5, 2.0]
      speed: [2.0, 3.4]
      climb_rate: [0.3, 0.5]
      weight: 1.5
    chirp:
      duration: [3.0, 4.0]
      amplitude: [0.5, 1.0]
      yaw_amplitude: [0.2, 0.4]
      f0: 0.2
      f1: 1.5
      weight: 1.0
    bounce:
      duration: [3.0, 4.0]
      height: [0.3, 0.6]
      period: [1.0, 1.6]
      weight: 1.0
    tumble:
      duration: [2.0, 3.0]
      rate: [3.0, 5.0]
      kick_seconds: 0.1
      gap_seconds: 0.4
      weight: 0.7

# Observation noise, added after the flights to train and test only (eval stays clean). One extra pickle per setting.
observation_noise:
  absolute_levels: [0.05, 0.1, 0.25, 0.5]   # one pickle per level: Gaussian noise std on x, v_b, w_b; rotation noise in rad
  train_noise_seed: 0
  test_noise_seed: 1999
  sensor:                         # one extra pickle imitating motion capture + gyro
    enabled: true
    position_sigma: 0.005         # m
    attitude_sigma_deg: 1.0
    velocity_from: central_difference   # central_difference | savitzky_golay (of noisy positions)
    savitzky_golay_window: 7      # savitzky_golay only
    gyro_white_sigma: 0.01        # rad/s
    gyro_bias_random_walk: 0.0001
audits:
  horizons_seconds: [0.1, 0.25, 0.5, 1.0, 2.0]   # horizons for the "signal vs noise" audit
output:
  window_points: 6                # stored windows (x, test_x): points per window
  window_stride: 5                # and the step between window starts
  write_pdf: true                 # write the dataset_analysis.pdf
  pdf_example_flights: 4          # example flights plotted in the PDF

# Settings that rebuild the existing datasets exactly (always kick_alignment: none; others as above):
#   HARD     hard;      damping pybullet_builtin; wind none; kick_torque last_step
#   EVALSET  eval;      as HARD + seeds.eval [498, 499], gates.max_saturation_fraction 0.08, envelope.max_speed 3.5,
#                       pdf_example_flights 6
#   WIND     hard+eval; as HARD + seeds.eval [499], linear wind ou with sigma_fraction_of_weight 0.1 (WIND25: 0.25)
#   WINDSDE* hard+eval; damping constant; wind constant / rate_dependent; seeds.eval [499]; gates.envelope_margin 1.5;
#            absolute_levels [0.25], sensor off; kick_torque last_step for HI, LO, C05, C05A005, else interval_mean;
#            sigma, gain and physics_hz per variant: datasets/QUADROTOR-DATASET-WINDSDE/*_config_used.yaml
