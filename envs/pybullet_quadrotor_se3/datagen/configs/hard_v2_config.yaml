# Generation config for QUADROTOR-DATASET-HARD-V2 (see tmp/AGGR_v2_generation_procedure.md).
# Every number here is a default from the design note; the copy actually used is stored in
# each pickle's settings and printed on the analysis PDF.
environment:            # Step 0
  drone_model: CF2P
  physics: PYB
  physics_hz: 1000
  sample_hz: 100                      # h = 1/sample_hz
  contact_free: true                  # remove ground plane, zero contact friction
  builtin_damping_coefficient: 0.5    # PyBullet linear/angular damping c
actuator:               # Step 0b
  input_mode: wrench                  # wrench | motor  (both inputs always stored)
  motor_gain_spread: 0.0              # epsilon_i ~ U(-spread, spread); 0 = nominal
  motor_lag_seconds: 0.0              # tau_m; 0 = no lag
flight:                 # Step 1
  duration_seconds: 10.0
initial_state:          # Step 2
  position_box: {x: [-2.5, 2.5], y: [-2.5, 2.5], z: [1.0, 4.0]}
  max_tilt_deg: 30
  max_speed: 1.0
  max_angular_rate: 1.0
envelope:               # Step 2 (gate + manoeuvre targets)
  position_box: {x: [-2.5, 2.5], y: [-2.5, 2.5], z: [0.5, 4.5]}
  max_tilt_deg: 45
  max_speed: 3.0
  max_angular_rate: 6.0
controller:             # Step 3
  type: dsl_pid
  gain_scale: 0.5                     # v1 half-scale PID
manoeuvres:             # Step 3
  segments_per_flight: [3, 5]
  library:
    waypoint_hop:        {duration: [1.5, 2.5], max_distance: 2.0, weight: 1.0}
    figure_eight:        {duration: [3.0, 4.0], radius: [0.5, 1.5], speed: [0.5, 3.0], weight: 1.0}
    circle:              {duration: [3.0, 4.0], radius: [0.5, 1.5], speed: [0.5, 3.0], weight: 0.5}
    vertical_step:       {duration: [1.5, 2.0], height: [1.0, 2.0], weight: 1.0}
    yaw_turn:            {duration: [1.0, 2.0], rate: [1.0, 4.0], weight: 0.7}
    aggressive_recovery: {duration: [1.5, 2.0], rate: [3.0, 5.0], kick_seconds: 0.1, weight: 0.7}   # torque kick J*rate/kick_seconds, then hover
    disturbed_hover:     {duration: [1.0, 2.0], gust_multiplier: 3.0, weight: 0.5}
gusts:                  # Step 4
  enabled: false                      # process noise off for identification datasets (5% mg gusts kept the perfect model 16 cm off at 1 s)
  time_constant_seconds: 0.5          # tau_w
  sigma_fraction_of_weight: 0.05      # sigma_w = fraction * m g
gates:                  # Step 5
  max_tilt_deg: 90
  min_altitude: 0.3
  envelope_margin: 0.5
  max_saturation_fraction: 0.05
  max_attempts: 20
splits:                 # Steps 5-6
  train_seeds: [300, 301, 302, 303, 304]
  test_seeds: [399]
  flights_per_seed: 10
  flight_seed_base: 7000000
noise:                  # Step 7
  absolute_levels: [0.05, 0.1, 0.25, 0.5]
  train_noise_seed: 0
  test_noise_seed: 1999
  sensor:
    enabled: true
    position_sigma: 0.005
    attitude_sigma_deg: 1.0
    velocity_from: central_difference   # central_difference | savitzky_golay
    savitzky_golay_window: 7
    gyro_white_sigma: 0.01
    gyro_bias_random_walk: 1.0e-4
audits:                 # Step 8
  horizons_seconds: [0.1, 0.25, 0.5, 1.0, 2.0]
output:                 # Steps 9-10
  directory: datasets/QUADROTOR-DATASET-HARD-V2
  tag: HARDV2
  window_points: 6                    # v1-compatible x / test_x arrays
  window_stride: 5
  write_pdf: true
  pdf_example_flights: 4
